# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool: rogers-agents
parameters:
  - name: runstage
    displayName: Select Stage To Run
    type: string
    default: checkov 
    values:
      - checkov
      - tflint
      - tfsec
      - terraformplan
      - all

stages:
  - stage: terraforminitandvalidtae
    displayName: Terraform Init And Validate
    dependsOn: []
    condition:  and(succeeded(), eq('${{ parameters.runStage }}', 'all'))
    jobs:
      - job: tearrforminit
        displayName: Run terraform init 
        steps:
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/Environment/Dev'
            backendServiceArm: 'rogers-svc'
            backendAzureRmResourceGroupName: 'test-rg'
            backendAzureRmStorageAccountName: 'teststrg56'
            backendAzureRmContainerName: 'test-container'
            backendAzureRmKey: 'dev.tfstate'

        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'validate'
            workingDirectory: '$(System.DefaultWorkingDirectory)/Environment/Dev'
  - stage: scanstagetflint
    displayName: Run Tf Lint
    dependsOn: []
    condition: and(succeeded(), or(eq('${{ parameters.runStage }}', 'tflint'), eq('${{ parameters.runStage }}', 'all')))
    jobs:
      - job: scanruntflint
        displayName: run the scan report
        steps:
        - task: PowerShell@2
          inputs:
            targetType: 'inline'
            script: |
              tflint --init 
               tflint
  - stage: scanruntfsec
    displayName: Run Tfsec
    dependsOn: []
    condition: and(succeeded(), or(eq('${{ parameters.runStage }}', 'tfsec'), eq('${{ parameters.runStage }}', 'all')))
    jobs:
      - job: runtfsec
        displayName: run tf sec
        steps:
        - task: PowerShell@2
          inputs:
            targetType: 'inline'
            script: 'tfsec .'

  - stage: scanchecov
    displayName: Run Checkov
    dependsOn: []
    condition: and(succeeded(), or(eq('${{ parameters.runStage }}', 'checkov'), eq('${{ parameters.runStage }}', 'all')))
    jobs:
      - job: runscancheckov
        displayName: run scan checkov
        steps:
        - task: PowerShell@2
          inputs:
            targetType: 'inline'
            script: |
                    checkov -d "$(Build.SourcesDirectory)" --framework terraform
                    if ($LASTEXITCODE -ne 0) {
                      Write-Host "##vso[task.logissue type=warning]Checkov found security issues. Continuing pipeline."
                      exit 0
                    }
  - stage: terraformplan
    dependsOn: []
    condition: and(succeeded(), or(eq('${{ parameters.runStage }}', 'terraformplan'), eq('${{ parameters.runStage }}', 'all')))
    jobs:
      - job: terraformplan 
        displayName: Run terraform plan 
        steps:
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/Environment/Dev'
            backendServiceArm: 'rogers-svc'
            backendAzureRmResourceGroupName: 'test-rg'
            backendAzureRmStorageAccountName: 'teststrg56'
            backendAzureRmContainerName: 'test-container'
            backendAzureRmKey: 'dev.tfstate'
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'plan'
            workingDirectory: '$(System.DefaultWorkingDirectory)/Environment/Dev'
            environmentServiceNameAzureRM: 'rogers-svc'

  - stage: terraformapply
    dependsOn: []
    condition: and(succeeded(), or(eq('${{ parameters.runStage }}', 'terraformpapply'), eq('${{ parameters.runStage }}', 'all')))
    jobs:
      - job: terraformplan
        displayName: Run terraform apply
        steps:
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/Environment/Dev'
            backendServiceArm: 'rogers-svc'
            backendAzureRmResourceGroupName: 'test-rg'
            backendAzureRmStorageAccountName: 'teststrg56'
            backendAzureRmContainerName: 'test-container'
            backendAzureRmKey: 'dev.tfstate'
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'apply'
            workingDirectory: '$(System.DefaultWorkingDirectory)/Environment/Dev'
            commandOptions: '-auto-approve'
            environmentServiceNameAzureRM: 'rogers-svc'


  


