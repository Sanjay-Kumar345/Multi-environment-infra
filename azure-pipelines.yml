# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool: rogers-agents

stages:
  - stage: terraforminitandvalidtae
    jobs:
      - job: tearrforminit
        displayName: Run terraform init 
        steps:
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/Environment/Dev'
            backendServiceArm: 'rogers-svc'
            backendAzureRmResourceGroupName: 'test-rg'
            backendAzureRmStorageAccountName: 'teststrg56'
            backendAzureRmContainerName: 'test-container'
            backendAzureRmKey: 'dev.tfstate'

        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'validate'
            workingDirectory: '$(System.DefaultWorkingDirectory)/Environment/Dev'
  - stage: scanstagetflint
    jobs:
      - job: scanruntflint
        displayName: run the scan report
        steps:
        - task: PowerShell@2
          inputs:
            targetType: 'inline'
            script: |
              tflint --init 
               tflint
  - stage: scanruntfsec
    jobs:
      - job: runtfsec
        displayName: run tf sec
        steps:
        - task: PowerShell@2
          inputs:
            targetType: 'inline'
            script: 'tfsec .'

  - stage: scanchecov
    jobs:
      - job: runscancheckov
        displayName: run scan checkov
        steps:
        - task: PowerShell@2
          inputs:
            targetType: 'inline'
            script: |
              script: |
                    checkov -d "$(Build.SourcesDirectory)" --framework terraform
                    if ($LASTEXITCODE -ne 0) {
                      Write-Host "##vso[task.logissue type=warning]Checkov found security issues. Continuing pipeline."
                      exit 0
                    }
  - stage: terraformplan
    jobs:
      - job: terraformplan 
        displayName: Run terraform plan 
        steps:
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/Environment/Dev'
            backendServiceArm: 'rogers-svc'
            backendAzureRmResourceGroupName: 'test-rg'
            backendAzureRmStorageAccountName: 'teststrg56'
            backendAzureRmContainerName: 'test-container'
            backendAzureRmKey: 'dev.tfstate'
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'plan'
            workingDirectory: '$(System.DefaultWorkingDirectory)/Environment/Dev'
            environmentServiceNameAzureRM: 'rogers-svc'
  


